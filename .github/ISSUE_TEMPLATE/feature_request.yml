name: Feature request
description: Propose a privacy-safe mode, region, source, or workflow improvement
title: "[Feature] "
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: "Describe generalized behavior only. Remove personal locations, identity, credentials, and proprietary data."
  - type: textarea
    id: need
    attributes:
      label: Transit-planning need
      description: Which reusable gap should the skill cover?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed contract or procedure
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Official sources and privacy impact
      description: Provide current public sources and explain how examples remain generic.
    validations:
      required: true
