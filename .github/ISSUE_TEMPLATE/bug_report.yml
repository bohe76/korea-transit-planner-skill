name: Bug report
description: Report a reproducible contract, documentation, or validation problem
title: "[Bug] "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: "Use fictional examples. Do not paste private addresses, credentials, calendar data, or unredacted trip history."
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Synthetic reproduction
      description: Provide a minimal privacy-safe example and exact validation command.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version or commit
      placeholder: 0.1.0 or commit SHA
    validations:
      required: true
  - type: textarea
    id: sources
    attributes:
      label: Relevant official sources
      description: Link operator/public documentation when the report concerns schedule, fare, or service rules.
